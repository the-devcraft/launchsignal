multitenancy_enabled: false
server:
  http_listen_port: 9009
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /tmp/mimir/data
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/blocks
  tsdb:
    dir: /tmp/mimir/tsdb
  bucket_store:
    sync_dir: /tmp/mimir/sync
ingester:
  ring:
    kvstore:
      store: inmemory
    replication_factor: 1
    instance_addr: 127.0.0.1
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory
compactor:
  sharding_ring:
    kvstore:
      store: inmemory
activity_tracker:
  filepath: /tmp/mimir/activity
usage_stats:
  enabled: false
